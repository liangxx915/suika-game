<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff6df">
  <title>合成大西瓜 · 小游戏</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FRUIT DROP</p>
        <h1>合成大西瓜<span>!</span></h1>
      </div>
      <button id="restart" class="restart" type="button">重新开始</button>
    </header>

    <section class="hud" aria-label="游戏信息">
      <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
      <div class="next-box"><span>下一个</span><canvas id="next" width="64" height="64" aria-label="下一个水果"></canvas></div>
      <p class="tip">轻点投放，<br>按住移动后松手投放。</p>
    </section>

    <section class="board-wrap" aria-label="游戏区域">
      <canvas id="game" width="420" height="610" aria-label="合成大西瓜游戏画面"></canvas>
      <div id="game-over" class="overlay" hidden>
        <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="over-title">
          <div class="dialog-fruit" aria-hidden="true">🍉</div>
          <h2 id="over-title">装不下啦！</h2>
          <p>本局得分 <strong id="final-score">0</strong></p>
          <button id="play-again" type="button">再玩一次</button>
        </div>
      </div>
    </section>

    <p class="footer-note">两个相同水果相碰，就会变成更大的水果。</p>
  </main>
</body>
</html>
